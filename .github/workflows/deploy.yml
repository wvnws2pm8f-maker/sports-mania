name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # VITE_GEMINI_API_KEY: 本文の「その場で翻訳」用に、ブラウザから直接Geminiを呼ぶために
      # 必要(2026-09-22追加)。ビルド時にJSバンドルへ埋め込まれる=公開される値になるため、
      # このAPIキーはGoogle Cloud Console側でサイトのドメインへのHTTPリファラー制限を
      # かけて運用すること。未設定でもビルド・翻訳無しでの動作は問題ない。
      - run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
