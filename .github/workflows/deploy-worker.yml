name: Deploy Translation Worker

# ニュース本文のその場翻訳を代行するCloudflare Worker(worker/)のデプロイ。
# 【重要・2026-09-23】GeminiのAPIキーがHTTPリファラー制限に対応していないため、いったんこの
# Workerを間に挟む方式にしたが、その後Gemini側の無料枠クォータが安定して枯渇することが判明。
# 本文の翻訳自体を「見出しのみAI翻訳、本文は原文のまま端末側の翻訳機能に任せる」方式へ変更した
# ため、現在アプリからはこのWorkerを呼んでいない(未使用)。Geminiの有料プラン等に切り替えて
# 本文のその場翻訳を復活させたくなった場合のために、コード自体は残してある。
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
