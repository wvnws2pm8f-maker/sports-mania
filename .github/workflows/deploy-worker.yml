name: Deploy Translation Worker

# ニュース本文のその場翻訳を代行するCloudflare Worker(worker/)のデプロイ。
# GEMINI_API_KEYはこのWorkerのシークレットとしてのみ保持され、ブラウザ側には一切渡らない
# (2026-09-23、GeminiのAPIキーがHTTPリファラー制限に対応していないため追加した仕組み)。
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
