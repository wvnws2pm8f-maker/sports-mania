name: Deploy Translation Worker

# ニュース本文のその場翻訳を代行するCloudflare Worker(worker/)のデプロイ。
# GEMINI_API_KEYはこのWorkerのシークレットとしてのみ保持され、ブラウザ側には一切渡らない
# (2026-09-23、GeminiのAPIキーがHTTPリファラー制限に対応していないため追加した仕組み)。
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # 一時的な調査ステップ(2026-09-23、「ずっと失敗しっぱなし」との報告を受けて再調査)。
      - name: Debug - call worker with allowed Origin
        run: |
          curl -s -i -X POST "https://sports-mania-translate.eeggxgjsd85.workers.dev" \
            -H "Content-Type: application/json" \
            -H "Origin: https://wvnws2pm8f-maker.github.io" \
            -d '{"text":"The quick brown fox jumps over the lazy dog. The home team won the game 3 to 1 last night."}'
