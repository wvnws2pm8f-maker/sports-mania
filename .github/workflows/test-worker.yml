name: Test Translation Worker

# 本文のその場翻訳(worker/)が実際に動いているか手動で確認するための、一時的な調査用ワークフロー。
# サンドボックス環境から直接Workerを叩けなかったため、GitHub Actions(外部ネットワーク制限なし)
# から実際にリクエストを送り、応答内容をログに出す。用が済んだら削除してよい。
on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Call worker with allowed Origin
        run: |
          echo "=== with correct Origin header ==="
          curl -s -i -X POST "https://sports-mania-translate.eeggxgjsd85.workers.dev" \
            -H "Content-Type: application/json" \
            -H "Origin: https://wvnws2pm8f-maker.github.io" \
            -d '{"text":"The quick brown fox jumps over the lazy dog. The home team won the game 3 to 1 last night."}'
      - name: Call worker without Origin (should be forbidden)
        run: |
          echo "=== without Origin header (should be 403) ==="
          curl -s -i -X POST "https://sports-mania-translate.eeggxgjsd85.workers.dev" \
            -H "Content-Type: application/json" \
            -d '{"text":"test"}'
