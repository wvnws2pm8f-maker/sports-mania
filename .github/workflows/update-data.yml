name: Update Sports Data

# ブラウザから直接ESPNの公開APIを叩くとCORSでブロックされるため、
# ここ(GitHub Actionsのサーバー環境)で定期的にデータを取得し、
# public/data/*.json としてコミットする。
# 【注意】既定のGITHUB_TOKENでのpushはGitHubの仕様でpush契機のワークフロー(deploy.yml)を
# 連鎖起動しないため、下の"Trigger site redeploy"ステップで明示的にdeploy.ymlを起動している。
# これが無いと、データは更新され続けても公開サイトは直近の「人間による」push時点のまま古くなる。
on:
  schedule:
    - cron: '*/15 * * * *' # 15分おき(UTC)
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # 下のdeploy.yml手動起動に必要

concurrency:
  group: update-sports-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch ESPN data
        run: node scripts/fetch-espn-data.mjs

      # サッカーの試合結果を「第何節」でまとめたいという要望(2026-09-22)への対応。
      # ESPNのAPIには節番号の公式フィールドが無いため自前で算出し、直前のステップが
      # 書き出したsoccer-*.jsonのgames配列にroundフィールドを追記する(そのためこのステップより後に置く)。
      # シーズン全体(月×10ヶ月分×5リーグ)を毎回取得し直すため他ステップより時間がかかりうるので、
      # 詰まっても後続のcommitを止めないようtimeout+continue-on-errorを付ける。
      - name: Fetch soccer round numbers
        run: node scripts/fetch-soccer-rounds.mjs
        timeout-minutes: 6
        continue-on-error: true

      # timeout-minutes: 全文翻訳の追加(2026-09-18)で1回の実行時間が延びたことがあり、
      # 万一ネットワーク呼び出しが詰まった場合に次の15分おきのcronに追い越されて
      # ジョブごとキャンセルされる(concurrency: cancel-in-progress)前に、
      # このステップ自身で安全に諦めさせる保険。
      - name: Fetch news (for home screen)
        run: node scripts/fetch-news.mjs
        timeout-minutes: 8
        continue-on-error: true # このステップが詰まって失敗しても、順位表・試合結果のコミットは止めない
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 未設定でも動く(翻訳なしの英語表示になるだけ)

      # F1はESPNではなくJolpica-F1(F1専用の無料API、無認証で200リクエスト/時間まで)を使う。
      # レース結果は年間24戦程度で15分おきの頻度は過剰だが、呼び出し回数がごく少なく
      # レート制限に全く引っかからないため、他データと同じタイミングでまとめて更新している。
      # continue-on-error: F1データ(第三者API)が落ちていても、ESPN分の更新・コミットは
      # 止めたくない(このステップだけ失敗させても後続のcommitステップは実行される)。
      - name: Fetch F1 data
        run: node scripts/fetch-f1-data.mjs
        continue-on-error: true

      # NFLは週(Week)単位で結果を見たいという要望があり、通常のスコアボード(直近数日分のみ)
      # とは別にレギュラーシーズン全18週分をまとめて取得する。18回のAPI呼び出しがあるが、
      # ESPNの公開APIには明示的なレート制限が見つかっておらず、他の取得と同じ頻度で問題ない。
      - name: Fetch NFL week-by-week data
        run: node scripts/fetch-nfl-weeks.mjs
        continue-on-error: true

      # 試合詳細(得点者・出場選手・打撃/投手成績)。「Fetch ESPN data」が書き出した
      # 直近の試合一覧を読んで、終了済みの試合だけ追加でsummaryを取得する。
      # フィールド名を実データで検証できていない部分があるため、失敗してもコミット自体は
      # 止めない(continue-on-error)。
      - name: Fetch game summaries (box scores)
        run: node scripts/fetch-game-summaries.mjs
        continue-on-error: true

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "sports-mania-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "変更なし。スキップします。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): update sports data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 【重要】github-actions bot自身が既定のGITHUB_TOKENでpushしても、GitHubの仕様上
      # (無限ループ防止のため)push契機のワークフロー(deploy.yml)は自動で連鎖起動されない。
      # このためデータは15分おきに更新されているのに、実際に公開されるサイトは
      # 直近に「人間が」pushした時点のデータのまま止まる、という不具合が長期間気づかれずにいた
      # (2026-09-12、順位表の地区分け修正が反映されないというユーザー報告で発覚)。
      # ここで明示的にdeploy.ymlをworkflow_dispatchで呼び出すことで解決する。
      - name: Trigger site redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}"
