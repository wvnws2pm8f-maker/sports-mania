name: Update Boxing Data

# ボクシングは無料APIが無いため、その年のボクシングのWikipedia記事を取得し、その文章から
# Gemma(無料枠)に試合結果・新しい試合を抜き出させて src/data/boxingSchedule.json を更新する
# (scripts/update-boxing-data.mjs)。結果確認は毎日、新しい試合の追加は週1回。
# 手動実行で dry_run にチェックを入れると、反映する内容をログに出すだけで書き換えない。
on:
  schedule:
    - cron: '30 8 * * *' # 毎日UTC 8:30(JST 17:30)
  workflow_dispatch:
    inputs:
      dry_run:
        description: '反映する内容を表示するだけで、ファイルは書き換えない'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # 下のdeploy.yml手動起動に必要

concurrency:
  group: update-boxing-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update boxing data
        run: node scripts/update-boxing-data.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_BOXING: ${{ vars.GEMINI_MODEL_BOXING }} # 未設定なら scripts/gemini.mjs の既定モデル
          BOXING_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}

      # update-data.ymlが15分おきにmainへpushしているため、push前に取り込み直す
      # (競合しても対象ファイルが違うのでrebaseは通る)。
      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "sports-mania-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/boxingSchedule.json src/data/boxerProfiles.json
          if git diff --cached --quiet; then
            echo "変更なし。スキップします。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): update boxing data"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
              [ "$i" = 3 ] && exit 1
              sleep 5
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # src/data はビルド時に取り込まれるので、反映には再デプロイが必要
      # (GITHUB_TOKENでのpushはdeploy.ymlを連鎖起動しないため明示的に呼ぶ。update-data.yml参照)。
      - name: Trigger site redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}"
